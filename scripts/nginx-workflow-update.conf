# Workflow app – /var/www/Workflow_App
# workflows.cloudextel.com on 80/443 only (no extra ports).
# Port 4001 freed for Policy Assistant backend.

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name workflows.cloudextel.com www.workflows.cloudextel.com;
    return 301 https://workflows.cloudextel.com$request_uri;
}

# HTTPS: workflows.cloudextel.com
server {
    listen 443 ssl;
    http2 on;
    server_name workflows.cloudextel.com www.workflows.cloudextel.com;

    ssl_certificate     /etc/ssl/ETIPL_SSL/fullchain.pem;
    ssl_certificate_key /etc/ssl/ETIPL_SSL/wc.cloudextel.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    root /var/www/Workflow_App/frontend/dist;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /maplibre-gl-csp-worker.js {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location /api {
        proxy_pass http://localhost:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    location /socket.io {
        proxy_pass http://localhost:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
