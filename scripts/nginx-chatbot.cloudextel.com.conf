# Nginx config for chatbot.cloudextel.com
# Copy to /etc/nginx/sites-available/ and symlink to sites-enabled. No new ports (uses 80/443).
# App runs on localhost:5174 (Next.js). If 5174 is used by another app, set CE_CHATBOT_FRONTEND_PORT and change proxy_pass below.
# After adding this, run: certbot --nginx -d chatbot.cloudextel.com  (certbot will add HTTPS and redirect)

server {
    listen 80;
    listen [::]:80;
    server_name chatbot.cloudextel.com 139.59.72.225;

    location / {
        proxy_pass http://127.0.0.1:5174;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
    }
}
