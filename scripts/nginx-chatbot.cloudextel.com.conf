# Nginx config for chatbot.cloudextel.com (Policy Assistant)
# App runs on localhost:5174 (Next.js). No new ports (uses 80/443).
# After adding: certbot --nginx -d chatbot.cloudextel.com

server {
    listen 80;
    listen [::]:80;
    server_name chatbot.cloudextel.com 139.59.72.225;

    location / {
        proxy_pass http://127.0.0.1:5174;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
    }
}
