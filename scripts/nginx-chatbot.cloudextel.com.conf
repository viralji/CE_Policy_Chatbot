# Nginx config for chatbot.cloudextel.com (Policy Assistant)
# Server has only ports 80 and 443 open. Nginx routes by Host to the correct app.
# This block handles ONLY chatbot.cloudextel.com → localhost:5174.
# Other domains (portal, workflows, wireline, etc.) have their own server blocks.

# HTTP → HTTPS redirect (chatbot.cloudextel.com only)
server {
    listen 80;
    listen [::]:80;
    server_name chatbot.cloudextel.com;
    return 301 https://chatbot.cloudextel.com$request_uri;
}

# HTTPS (chatbot.cloudextel.com → Policy Assistant on 5174)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name chatbot.cloudextel.com;

    ssl_certificate     /etc/ssl/ETIPL_SSL/fullchain.pem;
    ssl_certificate_key /etc/ssl/ETIPL_SSL/wc.cloudextel.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    location / {
        proxy_pass http://127.0.0.1:5174;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
    }
}
